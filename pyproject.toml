[project]
name = "han-decompose"
version = "0.0.1"
description = "Which contours of a font's Han glyph belong to which component of its ideographic description sequence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mkpoli" }]
dependencies = [
    "fonttools>=4.63",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "numpy>=2.1",
    "skia-pathops==0.9.2",
    "typer>=0.16",
]

[project.urls]
Repository = "https://github.com/mkpoli/han-decompose"

[project.scripts]
han-decompose = "han_decompose.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.14",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/han_decompose"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "han_decompose/_schema"
"pins" = "han_decompose/_pins"
"review" = "han_decompose/_review"
"LICENSES" = "han_decompose/_LICENSES"

[tool.hatch.build.targets.sdist]
include = ["/src", "/schema", "/pins", "/review", "/LICENSES", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not reproduction'"
markers = ["reproduction: a whole survey held against ids-input's, minutes long; run with -m reproduction"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["fontTools.*", "pathops.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
