[project]
name = "han-decompose"
version = "0.0.1"
description = "Which contours of a font's Han glyph belong to which component of its ideographic description sequence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mkpoli" }]
dependencies = [
    "typer>=0.16",
]

[project.urls]
Repository = "https://github.com/mkpoli/han-decompose"

[project.scripts]
han-decompose = "han_decompose.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/han_decompose"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
